{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | {{ site_title|default:_('Django site admin') }}{% endblock %}

{% block branding %}
<div id="site-name" style="display: flex; align-items: center; gap: 14px; padding: 6px 0;">
    <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 14px; text-decoration: none;">
        <img src="{% static 'images/logo.png' %}" alt="Althaf Jewellery Makers Logo" style="height: 48px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));" />
        <div style="display: flex; flex-direction: column;">
            <span style="font-family: Georgia, serif; color: #F5D061; font-size: 1.2rem; font-weight: 600; letter-spacing: 2px;">ALTHAF JEWELLERY MAKERS</span>
            <span style="color: #E2C068; font-size: 0.72rem; letter-spacing: 1.5px; text-transform: uppercase;">Heritage Luxury Administration Portal</span>
        </div>
    </a>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}
